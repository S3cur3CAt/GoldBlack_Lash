name: Compilar macOS DMG Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a compilar (ej: 0.0.7)'
        required: false
        default: '0.0.7'
  push:
    tags:
      - 'v*'

jobs:
  build-dmg:
    name: Generar instalador .dmg para macOS
    runs-on: macos-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Instalar dependencias de Admin
        run: |
          cd admin
          pnpm install --frozen-lockfile=false

      - name: Compilar Frontend React + Vite
        run: |
          cd admin
          pnpm run build

      - name: Empaquetar aplicación para macOS (darwin-x64)
        run: |
          cd admin
          node scripts/build-mac.mjs

      - name: Generar instalador DMG con hdiutil nativo de Apple
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          
          echo "Generando DMG para version: ${VERSION}"
          DMG_NAME="GoldBlack-Lash-Admin-${VERSION}-macOS-Monterey.dmg"
          DMG_PATH="admin/dist-installers/${DMG_NAME}"
          
          APP_PATH="admin/dist-packages/GoldBlack Lash Admin-darwin-x64/GoldBlack Lash Admin.app"
          
          # Crear directorio temporal para el layout del DMG
          mkdir -p dmg_staging
          cp -R "${APP_PATH}" dmg_staging/
          
          # Crear enlace simbólico hacia /Applications para arrastrar y soltar
          ln -s /Applications dmg_staging/Applications
          
          # Generar DMG comprimido (UDZO) con hdiutil nativo de macOS
          hdiutil create -volname "GoldBlack Lash Admin" -srcfolder dmg_staging -ov -format UDZO "${DMG_PATH}"
          
          echo "✓ Instalador DMG creado con éxito en: ${DMG_PATH}"
          ls -lh "${DMG_PATH}"

      - name: Subir instalador DMG a Release de GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.version != ''
        with:
          tag_name: ${{ github.ref_name || format('v{0}', github.event.inputs.version) }}
          files: admin/dist-installers/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
